<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Lobby</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
        }
        #messages {
            border: 1px solid #ccc;
            height: 400px;
            overflow-y: auto;
            padding: 10px;
            margin-bottom: 20px;
            background-color: #f9f9f9;
        }
        .message {
            margin: 10px 0;
            padding: 8px;
            background-color: #e3f2fd;
            border-radius: 5px;
        }
        .system-message {
            background-color: #e8f5e9;
            color: #2e7d32;
            font-style: italic;
        }
        #form {
            display: flex;
            gap: 10px;
        }
        #message {
            flex: 1;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        button {
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    
    <h1>Let's Chat!</h1>
    
    <!-- محل نمایش پیام‌ها -->
    <div id="messages">
        <div class="message system-message">Connecting to chat server...</div>
    </div>

    <form id="form">
        <input type="text" id="message" placeholder="Type your message here..." autocomplete="off">
        <button type="submit">Send</button>
    </form>

    <script type="text/javascript">
        let url = `ws://${window.location.host}/ws/socket-server/`
        const chatSocket = new WebSocket(url)

        // تابع کمکی برای اضافه کردن پیام به صفحه
        function addMessageToPage(message, isSystem = false) {
            const messagesDiv = document.getElementById('messages')
            const messageElement = document.createElement('div')
            messageElement.className = isSystem ? 'message system-message' : 'message'
            
            // اضافه کردن زمان به پیام‌ها
            const time = new Date().toLocaleTimeString()
            messageElement.innerHTML = `<strong>[${time}]</strong> ${message}`
            
            messagesDiv.appendChild(messageElement)
            // اسکرول خودکار به آخرین پیام
            messagesDiv.scrollTop = messagesDiv.scrollHeight
        }

        // هنگام باز شدن اتصال WebSocket
        chatSocket.onopen = function(e) {
            console.log('WebSocket connected!')
            addMessageToPage('✅ Connected to chat server!', true)
        }

        // دریافت پیام از سرور
        chatSocket.onmessage = function(e){
            let data = JSON.parse(e.data)
            console.log('Received from server:', data)
            
            // نمایش پیام دریافتی در صفحه
            if (data.type === 'connect') {
                addMessageToPage(data.message, true)
            } else {
                addMessageToPage(data.message, false)
            }
        }

        // خطا در اتصال
        chatSocket.onerror = function(e) {
            console.error('WebSocket error:', e)
            addMessageToPage('❌ Error connecting to server!', true)
        }

        // بسته شدن اتصال
        chatSocket.onclose = function(e) {
            console.log('WebSocket closed:', e)
            addMessageToPage('🔌 Disconnected from server!', true)
        }

        // ارسال پیام
        let form = document.getElementById('form')
        form.addEventListener('submit', (e)=> {
            e.preventDefault()
            let messageInput = document.getElementById('message')
            let message = messageInput.value.trim()
            
            if (message === '') {
                return // ارسال پیام خالی نکن
            }
            
            // نمایش پیام ارسالی در صفحه (پیام خود کاربر)
            addMessageToPage(`You: ${message}`, false)
            
            // ارسال به سرور
            chatSocket.send(JSON.stringify({
                'message': message
            }))
            
            messageInput.value = '' // پاک کردن input
            messageInput.focus() // فوکوس روی input
        })
    </script>

</body>
</html>
