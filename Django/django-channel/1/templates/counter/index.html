<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>counter</title>
</head>
<body>
   
    <h1 class="number">{{ count }}</h1>

</body>

<script>
    var socket = new WebSocket('ws://' + window.location.host + '/ws/counter/')

    socket.onmessage = function(e) {
        const data = JSON.parse(e.data);
        console.log(data);
        document.querySelector('.number').textContent = data.message;
    }
</script>

</html>
